<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Codex Background Studio</title>
  <style>
    :root{color-scheme:dark;--ink:#f4f2ec;--muted:#9d9a91;--line:#ffffff18;--lime:#d8ff70;--card:#171815cc;--bg:#0c0d0b}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font:14px/1.5 Inter,ui-sans-serif,system-ui;background:radial-gradient(circle at 8% 0,#2a331d 0,transparent 35%),radial-gradient(circle at 95% 80%,#24213b 0,transparent 36%),var(--bg)}button,input,select{font:inherit}.shell{width:min(1120px,calc(100% - 32px));margin:auto;padding:36px 0 54px}.top{display:flex;align-items:center;gap:14px;margin-bottom:28px}.mark{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:var(--lime);color:#11160a;font-weight:900;font-size:20px;box-shadow:0 0 35px #d8ff7030}.title{font-weight:750;font-size:18px;letter-spacing:-.02em}.sub{color:var(--muted);font-size:12px}.status{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}.dot{width:8px;height:8px;border-radius:50%;background:#70736c}.dot.on{background:var(--lime);box-shadow:0 0 15px var(--lime)}.grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(300px,.7fr);gap:18px}.card{border:1px solid var(--line);border-radius:22px;background:var(--card);backdrop-filter:blur(18px);box-shadow:0 28px 80px #0005}.preview{position:relative;min-height:590px;overflow:hidden;background:#222}.preview-bg{position:absolute;inset:-20px;background:center/cover no-repeat;transition:.2s;filter:blur(var(--blur,0));transform:scale(1.04)}.preview-bg:after{content:"";position:absolute;inset:0;background:#000;opacity:var(--dim,.34)}.mock{position:absolute;inset:26px;display:grid;grid-template-columns:150px 1fr;border:1px solid #ffffff20;border-radius:15px;overflow:hidden;background:#10110fea;box-shadow:0 25px 60px #0009}.side{background:rgba(16,17,15,var(--surface,.78));border-right:1px solid #ffffff15;padding:18px 12px}.brand{font-weight:700;margin:0 7px 23px}.nav{padding:8px;border-radius:8px;color:#aaa;margin:4px 0}.nav.active{background:#ffffff10;color:#fff}.chat{display:flex;flex-direction:column;background:rgba(18,19,17,var(--surface,.78));padding:30px}.bubble{align-self:flex-end;background:#ffffff13;border:1px solid #ffffff15;border-radius:14px 14px 4px 14px;padding:11px 14px;max-width:80%}.answer{margin-top:27px;color:#ddd}.code{margin-top:14px;padding:15px;border-radius:11px;background:#080907dd;border:1px solid #ffffff14;color:#d8ff70;font:12px/1.6 ui-monospace,monospace}.composer{margin-top:auto;padding:14px;border:1px solid #ffffff1c;border-radius:13px;color:#888;background:#ffffff0d}.controls{padding:24px}.eyebrow{margin:0 0 17px;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.13em}.drop{display:grid;place-items:center;min-height:130px;border:1px dashed #ffffff35;border-radius:15px;background:#ffffff06;text-align:center;cursor:pointer;transition:.2s}.drop:hover{border-color:var(--lime);background:#d8ff7008}.drop strong{display:block;margin-bottom:4px}.drop small{color:var(--muted)}#file{display:none}.row{margin-top:20px}.row label{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-bottom:8px}.row output{color:var(--ink)}input[type=range]{width:100%;accent-color:var(--lime)}select{width:100%;color:var(--ink);background:#0d0e0c;border:1px solid var(--line);border-radius:10px;padding:10px}.actions{display:grid;gap:9px;margin-top:25px}button{border:0;border-radius:11px;padding:12px 14px;cursor:pointer;font-weight:700}.primary{background:var(--lime);color:#11160a}.secondary{color:var(--ink);background:#ffffff0c;border:1px solid var(--line)}button:disabled{opacity:.5;cursor:wait}.note{margin-top:17px;color:var(--muted);font-size:11px}.toast{position:fixed;left:50%;bottom:28px;translate:-50% 20px;opacity:0;padding:11px 16px;border-radius:10px;background:#f4f2ec;color:#161713;font-weight:700;transition:.2s;pointer-events:none}.toast.show{opacity:1;translate:-50% 0}@media(max-width:820px){.grid{grid-template-columns:1fr}.preview{min-height:470px}.mock{inset:16px}.side{display:none}.mock{grid-template-columns:1fr}.shell{padding-top:20px}.status span:last-child{display:none}}
  </style>
</head>
<body><div class="shell">
  <div class="top"><div class="mark">C</div><div><div class="title">Codex Background Studio</div><div class="sub">本地运行 · 随时恢复</div></div><div class="status"><i class="dot" id="dot"></i><span id="status">正在检测 Codex…</span></div></div>
  <div class="grid">
    <section class="card preview"><div class="preview-bg" id="preview"></div><div class="mock"><div class="side"><div class="brand">Codex</div><div class="nav active">⌁ 当前任务</div><div class="nav">□ 自动化</div><div class="nav">◇ 项目</div></div><div class="chat"><div class="bubble">让工作区更有一点自己的气氛。</div><div class="answer">背景已应用。界面层保持半透明，文字与代码仍然清晰可读。<div class="code">background: personal;<br>focus: preserved;</div></div><div class="composer">向 Codex 发送消息…</div></div></div></section>
    <aside class="card controls"><p class="eyebrow">背景设置</p><label class="drop" for="file"><div><strong id="fileName">选择一张背景图</strong><small>PNG / JPG / WebP / GIF，最大 16 MB</small></div></label><input id="file" type="file" accept="image/png,image/jpeg,image/webp,image/gif">
      <div class="row"><label>暗色遮罩 <output id="dimOut">34%</output></label><input id="dim" type="range" min="0" max="85" value="34"></div>
      <div class="row"><label>背景模糊 <output id="blurOut">0 px</output></label><input id="blur" type="range" min="0" max="24" value="0"></div>
      <div class="row"><label>图片填充</label><select id="size"><option value="cover">铺满窗口</option><option value="contain">完整显示</option><option value="auto">原始尺寸</option></select></div>
      <div class="actions"><button class="primary" id="apply">启动 Codex 并应用</button><button class="secondary" id="restore">恢复原始界面</button></div>
      <div class="note">首次应用前请完全退出正在运行的 Codex。工具不会修改 Codex 安装文件；保持此窗口的命令行程序运行，才能自动为新窗口应用背景。</div>
    </aside>
  </div>
</div><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s);let image='';let imageName='';
function toast(s,bad=false){const t=$('#toast');t.textContent=s;t.style.background=bad?'#ff8178':'#f4f2ec';t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600)}
function syncPreview(){const dim=+$('#dim').value/100,blur=+$('#blur').value;$('#dimOut').value=Math.round(dim*100)+'%';$('#blurOut').value=blur+' px';const p=$('#preview');p.style.setProperty('--dim',dim);p.style.setProperty('--blur',blur+'px');if(image)p.style.backgroundImage=`url("${image}")`;}
async function api(url,opts){const r=await fetch(url,opts);const d=await r.json();if(!r.ok)throw Error(d.error||'操作失败');return d}
async function save(){if(!image&&imageName==='')throw Error('请先选择一张背景图。');await api('/api/config',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({...(image?{image}:{}),imageName,dim:+$('#dim').value/100,blur:+$('#blur').value,size:$('#size').value})})}
$('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;if(f.size>16*1024*1024){toast('图片超过 16 MB',true);return}const r=new FileReader;r.onload=()=>{image=r.result;imageName=f.name;$('#fileName').textContent=f.name;syncPreview()};r.readAsDataURL(f)};
['dim','blur'].forEach(id=>$('#'+id).oninput=syncPreview);$('#size').onchange=syncPreview;
$('#apply').onclick=async()=>{const b=$('#apply');b.disabled=true;b.textContent='正在启动…';try{await save();await api('/api/start',{method:'POST'});toast('背景已应用到 Codex');setTimeout(refresh,700)}catch(e){toast(e.message,true)}finally{b.disabled=false;b.textContent='启动 Codex 并应用'}};
$('#restore').onclick=async()=>{try{await api('/api/restore',{method:'POST'});toast('已恢复原始界面');refresh()}catch(e){toast(e.message,true)}};
async function refresh(){try{const s=await api('/api/status');$('#dot').classList.toggle('on',s.connected&&s.enabled);$('#status').textContent=s.connected?(s.enabled?`已连接 · ${s.sessions} 个页面`:'已连接 · 未应用'):(s.running?'Codex 正常运行，需退出后重启':'等待启动 Codex')}catch{$('#status').textContent='本地服务异常'}}
(async()=>{try{const c=await api('/api/config');$('#dim').value=Math.round(c.dim*100);$('#blur').value=c.blur;$('#size').value=c.size;imageName=c.imageName||'';if(imageName)$('#fileName').textContent=imageName+'（已保存）';syncPreview()}catch{}refresh();setInterval(refresh,2500)})();
</script></body></html>
